table:
  name: utility_lineup_progress
  schema: public
object_relationships:
  - name: utility_lineup
    using:
      foreign_key_constraint_on: utility_lineup_id
  - name: player
    using:
      foreign_key_constraint_on: steam_id
insert_permissions:
  - role: user
    permission:
      check:
        _and:
          - steam_id:
              _eq: X-Hasura-User-Id
          - utility_lineup:
              can_view:
                _eq: true
      set:
        steam_id: x-hasura-user-id
      columns:
        - utility_lineup_id
        - steam_id
        - attempts
        - successes
        - last_practiced_at
        - mastered_at
    comment: ''
