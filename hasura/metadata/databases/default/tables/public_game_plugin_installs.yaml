table:
  name: game_plugin_installs
  schema: public
object_relationships:
  - name: plugin
    using:
      foreign_key_constraint_on: plugin_slug
select_permissions:
  - role: administrator
    permission:
      columns:
        - plugin_slug
        - version
        - channel
        - enabled
        - disable_server_guidelines
        - cfg
        - load_ranked
        - load_tournaments
        - load_custom
        - created_at
        - updated_at
      filter: {}
      allow_aggregations: true
    comment: ""
insert_permissions:
  - role: administrator
    permission:
      check: {}
      columns:
        - plugin_slug
        - version
        - channel
        - enabled
        - disable_server_guidelines
        - cfg
        - load_ranked
        - load_tournaments
        - load_custom
    comment: ""
update_permissions:
  - role: administrator
    permission:
      columns:
        - plugin_slug
        - version
        - channel
        - enabled
        - disable_server_guidelines
        - cfg
        - load_ranked
        - load_tournaments
        - load_custom
      filter: {}
      check: {}
    comment: ""
delete_permissions:
  - role: administrator
    permission:
      filter: {}
    comment: ""
