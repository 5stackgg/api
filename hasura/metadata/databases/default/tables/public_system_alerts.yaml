table:
  name: system_alerts
  schema: public
object_relationships:
  - name: last_changed_by
    using:
      foreign_key_constraint_on: last_changed_by_steam_id
insert_permissions:
  - role: administrator
    permission:
      check: {}
      columns:
        - type
        - title
        - message
        - is_active
        - dismissible
        - expires_at
      set:
        created_by: x-hasura-user-id
    comment: ""
select_permissions:
  - role: administrator
    permission:
      columns:
        - id
        - type
        - title
        - message
        - is_active
        - dismissible
        - expires_at
        - created_by
        - created_at
        - updated_at
        - last_changed_at
        - last_changed_by_steam_id
      filter: {}
      allow_aggregations: true
    comment: ""
  - role: guest
    permission:
      columns:
        - id
        - type
        - title
        - message
        - is_active
        - dismissible
        - expires_at
        - created_by
        - created_at
        - updated_at
      filter: {}
    comment: ""
update_permissions:
  - role: administrator
    permission:
      columns:
        - type
        - title
        - message
        - is_active
        - dismissible
        - expires_at
        - updated_at
      filter: {}
      check: {}
    comment: ""
delete_permissions:
  - role: administrator
    permission:
      filter: {}
    comment: ""
