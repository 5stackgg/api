table:
  name: chat_message_edits
  schema: public
object_relationships:
  - name: author
    using:
      foreign_key_constraint_on: author_steam_id
select_permissions:
  - role: match_organizer
    permission:
      columns:
        - id
        - message_id
        - room_type
        - room_id
        - author_steam_id
        - previous_message
        - new_message
        - message_created_at
        - edited_at
      filter: {}
      allow_aggregations: true
    comment: What website chat said before its author edited it. Written only by the API.
  - role: moderator
    permission:
      columns:
        - id
        - message_id
        - room_type
        - room_id
        - author_steam_id
        - previous_message
        - new_message
        - message_created_at
        - edited_at
      filter:
        room_type:
          _neq: organizers
      allow_aggregations: true
    comment: The organizers' room is closed to moderators, and so is its evidence.
