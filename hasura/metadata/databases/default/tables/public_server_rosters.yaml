table:
  name: server_rosters
  schema: public
object_relationships:
  - name: server
    using:
      foreign_key_constraint_on: server_id
array_relationships:
  - name: sessions
    using:
      manual_configuration:
        column_mapping:
          server_id: server_id
        insertion_order: null
        remote_table:
          name: server_player_sessions
          schema: public
select_permissions:
  - role: moderator
    permission:
      columns:
        - reported_at
        - server_id
      filter: {}
    comment: ""
