table:
  name: server_plugin_configs
  schema: public
object_relationships:
  - name: plugin
    using:
      foreign_key_constraint_on: plugin_slug
  - name: server
    using:
      foreign_key_constraint_on: server_id
select_permissions:
  - role: administrator
    permission:
      columns:
        - server_id
        - plugin_slug
        - cfg
        - config
        - updated_at
      filter: {}
    comment: ""
