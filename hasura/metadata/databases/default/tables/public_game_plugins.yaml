table:
  name: game_plugins
  schema: public
array_relationships:
  - name: versions
    using:
      foreign_key_constraint_on:
        column: plugin_slug
        table:
          name: game_plugin_versions
          schema: public
  - name: game_modes
    using:
      foreign_key_constraint_on:
        column: plugin_slug
        table:
          name: game_mode_plugins
          schema: public
  - name: node_installs
    using:
      manual_configuration:
        column_mapping:
          slug: plugin_slug
        insertion_order: null
        remote_table:
          name: game_server_node_plugins
          schema: public
computed_fields:
  - name: install_state
    definition:
      function:
        name: game_plugin_install_state
        schema: public
    comment: Installed | Partial | Pending | Failed | Manual | NotInstalled
  - name: installed_node_count
    definition:
      function:
        name: game_plugin_installed_node_count
        schema: public
  - name: target_node_count
    definition:
      function:
        name: game_plugin_target_node_count
        schema: public
select_permissions:
  - role: administrator
    permission:
      columns:
        - slug
        - kind
        - name
        - author
        - description
        - homepage
        - tags
        - verified
        - hot_swappable
        - requires_service
        - config_schema
        - config_path
        - cvars
        - pairs_with
        - panel
        - wiring
        - synced_at
      computed_fields:
        - install_state
        - installed_node_count
        - target_node_count
      filter: {}
      allow_aggregations: true
    comment: ""
