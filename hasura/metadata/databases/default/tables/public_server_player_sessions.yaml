table:
  name: server_player_sessions
  schema: public
object_relationships:
  - name: player
    using:
      manual_configuration:
        column_mapping:
          player_steam_id: steam_id
        insertion_order: null
        remote_table:
          name: players
          schema: public
  - name: server
    using:
      foreign_key_constraint_on: server_id
select_permissions:
  - role: moderator
    permission:
      columns:
        - deaths
        - ended_at
        - id
        - ip
        - kills
        - name
        - player_steam_id
        - server_id
        - started_at
      filter: {}
      allow_aggregations: true
    comment: ""
