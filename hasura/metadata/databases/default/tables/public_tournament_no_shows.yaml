table:
  name: tournament_no_shows
  schema: public
object_relationships:
  - name: tournament
    using:
      foreign_key_constraint_on: tournament_id
  - name: tournament_team
    using:
      foreign_key_constraint_on: tournament_team_id
  - name: player
    using:
      foreign_key_constraint_on: player_steam_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - tournament_id
        - tournament_team_id
        - player_steam_id
        - occurred_at
      filter:
        player_steam_id:
          _eq: X-Hasura-User-Id
      allow_aggregations: true
    comment: ""
  - role: tournament_organizer
    permission:
      columns:
        - id
        - tournament_id
        - tournament_team_id
        - player_steam_id
        - occurred_at
      filter: {}
      allow_aggregations: true
    comment: ""
delete_permissions:
  - role: tournament_organizer
    permission:
      filter: {}
    comment: ""
