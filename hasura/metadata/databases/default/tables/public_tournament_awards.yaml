table:
  name: tournament_awards
  schema: public
object_relationships:
  - name: award
    using:
      foreign_key_constraint_on: award_id
  - name: tournament
    using:
      foreign_key_constraint_on: tournament_id
select_permissions:
  - role: guest
    permission:
      columns:
        - id
        - tournament_id
        - placement
        - award_id
        - custom_name
        - silhouette
        - image_url
        - created_at
        - updated_at
      filter: {}
    comment: ""
