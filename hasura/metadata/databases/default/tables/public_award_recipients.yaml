table:
  name: award_recipients
  schema: public
object_relationships:
  - name: award
    using:
      foreign_key_constraint_on: award_id
  - name: awarded_by
    using:
      foreign_key_constraint_on: awarded_by_steam_id
  - name: event
    using:
      foreign_key_constraint_on: event_id
  - name: league_season
    using:
      foreign_key_constraint_on: league_season_id
  - name: player
    using:
      foreign_key_constraint_on: player_steam_id
  - name: season
    using:
      foreign_key_constraint_on: season_id
  - name: team
    using:
      foreign_key_constraint_on: team_id
  - name: tournament
    using:
      foreign_key_constraint_on: tournament_id
  - name: tournament_award
    using:
      manual_configuration:
        column_mapping:
          placement: placement
          tournament_id: tournament_id
        insertion_order: null
        remote_table:
          name: tournament_awards
          schema: public
  - name: tournament_team
    using:
      foreign_key_constraint_on: tournament_team_id
select_permissions:
  - role: guest
    permission:
      columns:
        - id
        - award_id
        - tournament_id
        - season_id
        - event_id
        - league_season_id
        - tournament_team_id
        - team_id
        - player_steam_id
        - placement
        - placement_tier
        - source
        - awarded_by_steam_id
        - note
        - created_at
      filter: {}
      allow_aggregations: true
    comment: ""
