table:
  name: utility_demo_throws
  schema: public
object_relationships:
  - name: match
    using:
      foreign_key_constraint_on: match_id
  - name: match_map
    using:
      foreign_key_constraint_on: match_map_id
select_permissions:
  - role: administrator
    permission:
      columns:
        - match_map_demo_id
        - grenade_id
        - match_id
        - match_map_id
        - map_name
        - utility_type
        - side
        - technique
        - throw_strength
        - thrower_steam_id
        - round
        - tick
        - origin_x
        - origin_y
        - origin_z
        - land_x
        - land_y
        - land_z
        - view_yaw
        - view_pitch
        - flight_time_ms
        - lineup_bucket
        - thrown_at
        - created_at
      filter: {}
      allow_aggregations: true
    comment: 'Deliberately admin-only: a row names a player and the match they threw it in, which the aggregate in utility_meta_lineups does not. Browse the clusters, not the facts.'
