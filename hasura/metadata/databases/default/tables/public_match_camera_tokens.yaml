table:
  name: match_camera_tokens
  schema: public
object_relationships:
  - name: match
    using:
      foreign_key_constraint_on: match_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - match_id
        - steam_id
        - token
        - created_at
      filter:
        steam_id:
          _eq: X-Hasura-User-Id
    comment: ""
