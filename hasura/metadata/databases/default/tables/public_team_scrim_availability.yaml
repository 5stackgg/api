table:
  name: team_scrim_availability
  schema: public
object_relationships:
  - name: team
    using:
      foreign_key_constraint_on: team_id
insert_permissions:
  - role: user
    permission:
      check:
        team:
          _or:
            - owner_steam_id:
                _eq: X-Hasura-User-Id
            - roster:
                _and:
                  - role:
                      _eq: Admin
                  - player_steam_id:
                      _eq: X-Hasura-User-Id
      columns:
        - team_id
        - starts_at
        - ends_at
        - recurring_weekly
    comment: ""
  - role: match_organizer
    permission:
      check: {}
      columns:
        - team_id
        - starts_at
        - ends_at
        - recurring_weekly
    comment: ""
select_permissions:
  - role: guest
    permission:
      columns:
        - id
        - team_id
        - starts_at
        - ends_at
        - recurring_weekly
        - created_at
      filter: {}
      allow_aggregations: true
    comment: ""
update_permissions:
  - role: user
    permission:
      columns:
        - starts_at
        - ends_at
        - recurring_weekly
      filter:
        team:
          _or:
            - owner_steam_id:
                _eq: X-Hasura-User-Id
            - roster:
                _and:
                  - role:
                      _eq: Admin
                  - player_steam_id:
                      _eq: X-Hasura-User-Id
      check: null
    comment: ""
  - role: match_organizer
    permission:
      columns:
        - starts_at
        - ends_at
        - recurring_weekly
      filter: {}
      check: null
    comment: ""
delete_permissions:
  - role: user
    permission:
      filter:
        team:
          _or:
            - owner_steam_id:
                _eq: X-Hasura-User-Id
            - roster:
                _and:
                  - role:
                      _eq: Admin
                  - player_steam_id:
                      _eq: X-Hasura-User-Id
    comment: ""
  - role: match_organizer
    permission:
      filter: {}
    comment: ""
event_triggers:
  # Matches the team now and arms its window openings (ScrimsController).
  - name: team_scrim_availability_events
    definition:
      enable_manual: true
      insert:
        columns: '*'
      update:
        columns: '*'
      delete:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 60
      timeout_sec: 60
    webhook: '{{HASURA_GRAPHQL_EVENT_HOOK}}'
