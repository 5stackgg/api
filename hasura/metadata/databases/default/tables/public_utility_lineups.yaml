table:
  name: utility_lineups
  schema: public
object_relationships:
  - name: author
    using:
      foreign_key_constraint_on: author_steam_id
  - name: team
    using:
      foreign_key_constraint_on: team_id
  - name: source_match
    using:
      foreign_key_constraint_on: source_match_id
  - name: source_match_map
    using:
      foreign_key_constraint_on: source_match_map_id
  - name: forked_from
    using:
      foreign_key_constraint_on: forked_from_utility_lineup_id
array_relationships:
  - name: votes
    using:
      foreign_key_constraint_on:
        column: utility_lineup_id
        table:
          name: utility_lineup_votes
          schema: public
  - name: favorited_by
    using:
      foreign_key_constraint_on:
        column: utility_lineup_id
        table:
          name: utility_lineup_favorites
          schema: public
  - name: progress
    using:
      foreign_key_constraint_on:
        column: utility_lineup_id
        table:
          name: utility_lineup_progress
          schema: public
  - name: collection_items
    using:
      foreign_key_constraint_on:
        column: utility_lineup_id
        table:
          name: utility_collection_items
          schema: public
  - name: repairs
    using:
      foreign_key_constraint_on:
        column: utility_lineup_id
        table:
          name: utility_lineup_repairs
          schema: public
computed_fields:
  - name: can_view
    definition:
      function:
        name: can_view_utility_lineup
        schema: public
      session_argument: hasura_session
  - name: can_edit
    definition:
      function:
        name: can_edit_utility_lineup
        schema: public
      session_argument: hasura_session
  - name: my_vote
    definition:
      function:
        name: utility_lineup_my_vote
        schema: public
      session_argument: hasura_session
  - name: is_favorited
    definition:
      function:
        name: utility_lineup_is_favorited
        schema: public
      session_argument: hasura_session
  - name: difficulty
    definition:
      function:
        name: utility_lineup_difficulty
        schema: public
insert_permissions:
  - role: user
    permission:
      check:
        author_steam_id:
          _eq: X-Hasura-User-Id
      set:
        author_steam_id: x-hasura-user-id
      columns:
        - map_name
        - workshop_map_id
        - utility_type
        - side
        - technique
        - throw_strength
        - jump_throw_bind
        - origin_x
        - origin_y
        - origin_z
        - eye_z
        - view_yaw
        - view_pitch
        - land_x
        - land_y
        - land_z
        - flight_time_ms
        - name
        - description
        - tags
        - visibility
        - team_id
