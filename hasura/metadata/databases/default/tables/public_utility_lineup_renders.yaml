table:
  name: utility_lineup_renders
  schema: public
object_relationships:
  - name: lineup
    using:
      foreign_key_constraint_on: utility_lineup_id
  - name: requested_by
    using:
      foreign_key_constraint_on: requested_by_steam_id
  - name: game_server_node
    using:
      foreign_key_constraint_on: game_server_node_id
  - name: practice_session
    using:
      foreign_key_constraint_on: utility_practice_session_id
select_permissions:
  - role: moderator
    permission:
      columns:
        - id
        - utility_lineup_id
        - requested_by_steam_id
        - map_name
        - k8s_job_name
        - game_server_node_id
        - utility_practice_session_id
        - spec
        - status
        - progress
        - error_message
        - skip_reason
        - duration_ms
        - paused
        - sort_index
        - status_history
        - last_status_at
        - created_at
      filter: {}
      allow_aggregations: true
    comment: 'session_token is absent on purpose: it is the pod''s credential, not queue state.'
  - role: administrator
    permission:
      columns:
        - id
        - utility_lineup_id
        - requested_by_steam_id
        - map_name
        - k8s_job_name
        - game_server_node_id
        - utility_practice_session_id
        - spec
        - status
        - progress
        - error_message
        - skip_reason
        - duration_ms
        - paused
        - sort_index
        - status_history
        - last_status_at
        - created_at
      filter: {}
      allow_aggregations: true
    comment: 'session_token is absent on purpose: it is the pod''s credential, not queue state.'
