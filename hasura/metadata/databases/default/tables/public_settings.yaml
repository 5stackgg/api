table:
  name: settings
  schema: public
insert_permissions:
  - role: administrator
    permission:
      check: {}
      columns:
        - name
        - value
    comment: ""
select_permissions:
  - role: administrator
    permission:
      columns:
        - name
        - value
      filter:
        name:
          _nin:
            - web_push_private_key
            - giphy_api_key
            - twitch_client_secret
    comment: ""
  - role: guest
    permission:
      columns:
        - name
        - value
      filter:
        name:
          _like: public.%
    comment: ""
update_permissions:
  - role: administrator
    permission:
      columns:
        - value
      filter: {}
      check: {}
    comment: ""
delete_permissions:
  - role: administrator
    permission:
      filter: {}
    comment: ""
event_triggers:
  - name: settings
    definition:
      delete:
        columns: '*'
      enable_manual: false
      insert:
        columns: '*'
      update:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 60
      timeout_sec: 60
    webhook: '{{HASURA_GRAPHQL_EVENT_HOOK}}'
  # A full scrim pass when the finder is switched back on (ScrimsController).
  - name: scrim_finder_settings
    definition:
      enable_manual: true
      insert:
        columns: '*'
      update:
        columns:
          - value
    retry_conf:
      interval_sec: 10
      num_retries: 60
      timeout_sec: 60
    webhook: '{{HASURA_GRAPHQL_EVENT_HOOK}}'
