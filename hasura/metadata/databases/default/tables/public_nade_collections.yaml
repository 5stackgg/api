table:
  name: nade_collections
  schema: public
object_relationships:
  - name: owner
    using:
      foreign_key_constraint_on: owner_steam_id
  - name: team
    using:
      foreign_key_constraint_on: team_id
array_relationships:
  - name: items
    using:
      foreign_key_constraint_on:
        column: collection_id
        table:
          name: nade_collection_items
          schema: public
computed_fields:
  - name: can_view
    definition:
      function:
        name: can_view_nade_collection
        schema: public
      session_argument: hasura_session
  - name: can_edit
    definition:
      function:
        name: can_edit_nade_collection
        schema: public
      session_argument: hasura_session
insert_permissions:
  - role: user
    permission:
      check:
        owner_steam_id:
          _eq: X-Hasura-User-Id
      set:
        owner_steam_id: x-hasura-user-id
      columns:
        - name
        - description
        - map_name
        - team_id
        - visibility
    comment: ''
