table:
  name: abandoned_matches
  schema: public
object_relationships:
  - name: match
    using:
      foreign_key_constraint_on: match_id
select_permissions:
  - role: match_organizer
    permission:
      columns:
        - steam_id
        - abandoned_at
        - match_id
        - id
      filter: {}
      allow_aggregations: true
    comment: ""
delete_permissions:
  - role: match_organizer
    permission:
      filter: {}
    comment: ""
