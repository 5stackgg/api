table:
  name: tournament_team_invites
  schema: public
event_triggers:
  - name: tournament_team_invite_events
    definition:
      enable_manual: false
      insert:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 3
      timeout_sec: 60
    webhook: '{{HASURA_GRAPHQL_EVENT_HOOK}}'
object_relationships:
  - name: invited_by
    using:
      foreign_key_constraint_on: invited_by_player_steam_id
  - name: player
    using:
      foreign_key_constraint_on: steam_id
  - name: team
    using:
      foreign_key_constraint_on: tournament_team_id
select_permissions:
  - role: user
    permission:
      columns:
        - invited_by_player_steam_id
        - steam_id
        - created_at
        - id
        - tournament_team_id
      filter:
        _or:
          - player:
              steam_id:
                _eq: X-Hasura-User-Id
          - _and:
              - team:
                  roster:
                    _and:
                      - player_steam_id:
                          _eq: X-Hasura-User-Id
                      - _or:
                          - role:
                              _eq: Admin
                          - role:
                              _eq: Invite
    comment: ""
delete_permissions:
  - role: user
    permission:
      filter:
        _or:
          - player:
              steam_id:
                _eq: X-Hasura-User-Id
          - _and:
              - team:
                  roster:
                    _and:
                      - player_steam_id:
                          _eq: X-Hasura-User-Id
                      - _or:
                          - role:
                              _eq: Admin
                          - role:
                              _eq: Invite
    comment: ""
