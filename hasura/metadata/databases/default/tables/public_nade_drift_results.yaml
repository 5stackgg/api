table:
  name: nade_drift_results
  schema: public
object_relationships:
  - name: scan
    using:
      foreign_key_constraint_on: nade_drift_scan_id
  - name: nade_lineup
    using:
      foreign_key_constraint_on: nade_lineup_id
insert_permissions: []
select_permissions:
  - role: administrator
    permission:
      columns:
        - nade_drift_scan_id
        - nade_lineup_id
        - verdict
        - severity
        - reason
        - distance
        - distance_xy
        - distance_z
        - created_at
      filter: {}
      allow_aggregations: true
    comment: 'Verdicts only. The simulator''s endpoints are meaningless on their own and are deliberately not stored, so nothing here can be read as where a nade lands.'
update_permissions: []
delete_permissions: []
