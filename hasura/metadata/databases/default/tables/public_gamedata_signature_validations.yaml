table:
  name: gamedata_signature_validations
  schema: public
object_relationships:
  - name: game_server_node
    using:
      foreign_key_constraint_on: game_server_node_id
  - name: game_version
    using:
      manual_configuration:
        column_mapping:
          build_id: build_id
        insertion_order: null
        remote_table:
          name: game_versions
          schema: public
  - name: requested_by
    using:
      foreign_key_constraint_on: requested_by_steam_id
select_permissions:
  - role: administrator
    permission:
      columns:
        - id
        - build_id
        - branch
        - status
        - results
        - validated_at
        - started_at
        - game_server_node_id
        - trigger
        - requested_by_steam_id
        - previous_build_id
        - changes
      filter: {}
      allow_aggregations: true
    comment: ""
