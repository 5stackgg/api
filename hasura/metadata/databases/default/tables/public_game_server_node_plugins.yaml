table:
  name: game_server_node_plugins
  schema: public
object_relationships:
  - name: game_server_node
    using:
      foreign_key_constraint_on: game_server_node_id
  - name: plugin
    using:
      manual_configuration:
        column_mapping:
          plugin_slug: slug
        insertion_order: null
        remote_table:
          name: game_plugins
          schema: public
select_permissions:
  - role: administrator
    permission:
      columns:
        - id
        - game_server_node_id
        - plugin_slug
        - runtime
        - version
        - detected_version
        - channel
        - status
        - source
        - detected
        - last_error
        - installed_at
        - created_at
        - updated_at
      filter: {}
      allow_aggregations: true
    comment: ""
insert_permissions:
  - role: administrator
    permission:
      check: {}
      columns:
        - game_server_node_id
        - plugin_slug
        - runtime
        - version
        - detected_version
        - channel
        - status
        - source
        - detected
        - last_error
        - installed_at
    comment: ""
update_permissions:
  - role: administrator
    permission:
      columns:
        - game_server_node_id
        - plugin_slug
        - runtime
        - version
        - detected_version
        - channel
        - status
        - source
        - detected
        - last_error
        - installed_at
      filter: {}
      check: {}
    comment: ""
delete_permissions:
  - role: administrator
    permission:
      filter: {}
    comment: ""
