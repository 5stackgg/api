table:
  name: nade_lineup_favorites
  schema: public
object_relationships:
  - name: nade_lineup
    using:
      foreign_key_constraint_on: nade_lineup_id
  - name: player
    using:
      foreign_key_constraint_on: steam_id
insert_permissions:
  - role: user
    permission:
      check:
        _and:
          - steam_id:
              _eq: X-Hasura-User-Id
          - nade_lineup:
              can_view:
                _eq: true
      set:
        steam_id: x-hasura-user-id
      columns:
        - nade_lineup_id
        - steam_id
    comment: ''
  - role: verified_user
    permission:
      check:
        _and:
          - steam_id:
              _eq: X-Hasura-User-Id
          - nade_lineup:
              can_view:
                _eq: true
      set:
