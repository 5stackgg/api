# Edge cache for a 5stack panel's Playcast relay. Deploy it as a route on the
# panel's relay domain (RELAY_DOMAIN, tv.<your domain> by default), which has
# to be proxied through Cloudflare (orange cloud):
#
#   npx wrangler deploy --config cloudflare-workers/playcast-relay/wrangler.toml \
#     --route "tv.example.com/*"
#
# Then set that route's request limit failure mode to "Fail open" in the
# Cloudflare dashboard, so broadcasts keep flowing straight to the panel if the
# Workers daily request limit is ever reached.

name = "5stack-playcast-relay"
main = "worker.js"
compatibility_date = "2025-04-29"
workers_dev = false
