# Edge cache for a 5stack panel's Playcast relay. The panel can deploy this
# itself (Settings -> Streaming -> Playcast); to deploy it by hand instead, set
# the route below to a hostname on one of your Cloudflare domains and run:
#
#   npx wrangler deploy --config cloudflare-workers/playcast-relay/wrangler.toml \
#     --var ORIGIN:https://relay.example.com
#
# then paste https://<that hostname> into the same settings page.
#
# It has to be a custom domain: Cloudflare's Cache API does nothing on
# workers.dev, so there it would only add a hop.

name = "5stack-playcast-relay"
main = "worker.js"
compatibility_date = "2025-04-29"
workers_dev = false
routes = [{ pattern = "playcast.example.com", custom_domain = true }]

[vars]
# The panel's relay domain: where game servers post their broadcast.
ORIGIN = ""
